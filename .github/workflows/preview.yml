name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  preview:
    name: deploy Workers Preview
    # フォークからの PR には Cloudflare の認証情報を渡さない
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN が未設定のため Preview をスキップします"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.creds.outputs.ok == 'true'
        uses: actions/checkout@v4
      - if: steps.creds.outputs.ok == 'true'
        run: rustup show active-toolchain || rustup toolchain install
      - if: steps.creds.outputs.ok == 'true'
        uses: Swatinem/rust-cache@v2
      - if: steps.creds.outputs.ok == 'true'
        uses: ./.github/actions/setup-worker-build
      - if: steps.creds.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.creds.outputs.ok == 'true'
        run: npm ci
      - if: steps.creds.outputs.ok == 'true'
        # wrangler preview も [build] の worker-build を実行するが、ログが --json の出力に混ざらないよう先にビルドしておく
        run: worker-build --release
      - if: steps.creds.outputs.ok == 'true'
        id: preview
        name: Create or update Preview
        run: |
          set -o pipefail
          output="$(npx wrangler preview --name "$PREVIEW_NAME" --message "${GITHUB_SHA::7}" --json)"
          printf '%s\n' "$output"
          preview_url="$(printf '%s' "$output" | jq -er '.preview.urls[0]')"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
      - if: steps.creds.outputs.ok == 'true'
        name: Probe Preview
        run: |
          curl --fail --show-error --silent -X POST "$PREVIEW_URL/graphql" \
            -H 'Content-Type: application/json' \
            -d '{"query":"{ todos { id } }"}'
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
      - if: steps.creds.outputs.ok == 'true'
        name: Comment Preview URL
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --edit-last --create-if-none \
            --body "Workers Preview (\`${GITHUB_SHA::7}\`): $PREVIEW_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}

  cleanup:
    name: delete Workers Preview
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/checkout@v4
      - name: Delete Preview
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler preview delete --name "$PREVIEW_NAME" --skip-confirmation
